[package]
name = "ccm-compat"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/drdebmath/CCMModel"
rust-version = "1.75"
description = "Legacy JSON compatibility adapters for CCM simulation traces"

[dependencies]
ccm-core = { path = "../ccm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
